# FairLens India - pre-registered configuration
# IMPORTANT: audit thresholds, planted effect sizes, and approval threshold are
# fixed here BEFORE the first audit run. They must not be tuned after seeing
# audit results. See expected_findings.md and DECISIONS.md.

project: FairLens India
seed: 42

api:
  host: 127.0.0.1
  port: 8010
  base_url: http://127.0.0.1:8010
  timeout_seconds: 20
  batch_size: 500
  retries: 3
  # Pair-level probe events are delivered to the API in batches of this size.
  probe_event_batch_size: 25

data:
  synthetic_only: true
  n_observational: 4000

audit:
  alpha: 0.05
  correction: holm
  min_pairs: 1000
  materiality: 0.02
  n_pairs: 2000
  min_cell_size: 200
  intersectional_pairs_per_cell: 500
  matched_n_pairs: 1000
  income_bands: 5
  seeds: [1, 2, 3, 4, 5]
  bootstrap_iterations: 4000
  ci_level: 0.95
  # Pre-registered sequential stopping for single-attribute probes. Disabled by
  # default so v1 fixed-sample results remain reproducible. When enabled, the
  # audit may stop once the running normal-approximation CI excludes materiality
  # (see DECISIONS.md D-018). Intersectional cells remain fixed-sample.
  sequential:
    enabled: false
    min_pairs: 1000
    check_every: 200

# Target adapters (v2). `probe_cap` is a hard ceiling on applicants sent to a
# custom target in one audit; the sandbox validation adapters ship 100000.
targets:
  probe_cap: 100000
  sandbox_dir: targets/sandbox

models:
  approval_threshold: 500.0
  # Base score (models 1-6). Coefficients are data-generating choices, not
  # audit thresholds; they are fixed before the first audit.
  base_intercept: 300.0
  base_income_weight: 120.0
  base_credit_weight: 180.0
  base_employment_weight: 80.0
  base_burden_weight: 60.0
  income_floor: 250000.0
  income_ceiling: 5000000.0
  # Planted penalties (fixed up front)
  penalty_gender: 120.0
  penalty_pincode: 120.0
  penalty_name: 120.0
  penalty_intersectional: 240.0
  # Model 6: deterministic per-applicant Gaussian noise from noise_seed +
  # applicant payload (independent across twins, stable across retries)
  noise_sd: 70.0
  noise_seed: 6
  # Model 7: income-only score
  income_only_intercept: 500.0
  income_only_slope: 160.0
  income_only_log_scale: 0.6
  income_only_reference_income: 600000.0

mitigation:
  offset_min: 0
  offset_max: 240
  offset_step: 20
  max_accuracy_loss_default: 0.02
  n_samples: 6000

certificate:
  db_path: data/certificates.db

# Audit API service (v2). Operational settings only; no audit thresholds.
service:
  host: 127.0.0.1
  port: 8020
  audit_db: data/audits.db
  max_workers: 2
  sse_poll_seconds: 0.1

report:
  max_words: 250

# LLM screener target (R3c). Operational limits only; no audit thresholds.
# Pricing is an estimate used for the hard cost cap, not a billing record.
llm:
  api_key_env: ANTHROPIC_API_KEY
  model_env: ANTHROPIC_MODEL
  repeats: 3
  temperature: 0.0
  max_tokens: 64
  max_calls_per_audit: 300
  max_cost_usd: 1.00
  input_cost_per_mtok_usd: 3.00
  output_cost_per_mtok_usd: 15.00
  cache_dir: data/llm_cache
  pairs_per_probe: 24
