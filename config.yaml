# FairLens India - pre-registered configuration
# IMPORTANT: audit thresholds, planted effect sizes, and approval threshold are
# fixed here BEFORE the first audit run. They must not be tuned after seeing
# audit results. See expected_findings.md and DECISIONS.md.

project: FairLens India
seed: 42

api:
  host: 127.0.0.1
  port: 8010
  base_url: http://127.0.0.1:8010
  timeout_seconds: 20
  batch_size: 500
  retries: 3
  # Pair-level probe events are delivered to the API in batches of this size.
  probe_event_batch_size: 25

data:
  synthetic_only: true
  n_observational: 4000

audit:
  alpha: 0.05
  correction: holm
  min_pairs: 1000
  materiality: 0.02
  n_pairs: 2000
  min_cell_size: 200
  intersectional_pairs_per_cell: 500
  matched_n_pairs: 1000
  income_bands: 5
  seeds: [1, 2, 3, 4, 5]
  bootstrap_iterations: 4000
  ci_level: 0.95
  # Pre-registered sequential stopping for single-attribute probes. Disabled by
  # default so v1 fixed-sample results remain reproducible. When enabled, the
  # audit may stop once the running normal-approximation CI excludes materiality
  # (see DECISIONS.md D-018). Intersectional cells remain fixed-sample.
  sequential:
    enabled: false
    min_pairs: 1000
    check_every: 200
  # Generalized search (R5). Pre-registered before implementation in
  # expected_findings.md. Off by default so suite A (Models 1-7) keeps the
  # frozen v1 protocol; suite B audits opt in.
  search:
    enabled: false
    max_context_depth: 3
    correction: holm
    family: all_cells
    min_cell_size: 200
    main_effect_pairs: 1000
    cell_pairs: 200
    confirmation_pairs: 400
    discovery_confirmation_ratio: "80:20"
    max_confirmation_candidates: 16
    mde_assumed_discordance: 0.25
    mde_power: 0.80
    # Pre-registered deep panel. Depth-1 contexts are generated from the
    # attribute registry; these cells add depth 2-3 without an exhaustive
    # enumeration that cannot fit the probe cap.
    deep_panel:
      gender:
        - {age: "45+", urban_rural: rural, name_group: N2}
        - {pincode_group: P2, loan_amount: high}
        - {age: "45+", pincode_group: P2}
        - {income: low, loan_amount: high}
      pincode_group:
        - {gender: female, loan_amount: high}
        - {age: "45+", gender: female}
        - {name_group: N2, age: "45+"}
        - {urban_rural: rural, loan_amount: high}
      name_group:
        - {age: "45+", pincode_group: P2}
        - {gender: female, age: "45+"}
        - {loan_amount: high, urban_rural: rural}
        - {income: low, age: "45+"}
      age:
        - {name_group: N2, gender: female}
        - {pincode_group: P2, urban_rural: rural}
        - {loan_amount: high, gender: female}
        - {income: low, name_group: N2}

# Target adapters (v2). `probe_cap` is a hard ceiling on applicants sent to a
# custom target in one audit; the sandbox validation adapters ship 100000.
targets:
  probe_cap: 100000
  sandbox_dir: targets/sandbox

models:
  approval_threshold: 500.0
  # Base score (models 1-6). Coefficients are data-generating choices, not
  # audit thresholds; they are fixed before the first audit.
  base_intercept: 300.0
  base_income_weight: 120.0
  base_credit_weight: 180.0
  base_employment_weight: 80.0
  base_burden_weight: 60.0
  income_floor: 250000.0
  income_ceiling: 5000000.0
  # Planted penalties (fixed up front)
  penalty_gender: 120.0
  penalty_pincode: 120.0
  penalty_name: 120.0
  penalty_intersectional: 240.0
  # Model 6: deterministic per-applicant Gaussian noise from noise_seed +
  # applicant payload (independent across twins, stable across retries)
  noise_sd: 70.0
  noise_seed: 6
  # Model 7: income-only score
  income_only_intercept: 500.0
  income_only_slope: 160.0
  income_only_log_scale: 0.6
  income_only_reference_income: 600000.0

# Suite B (R5) planted behaviour and control B. Written before any model 8-15
# code existed; see expected_findings.md "Suite B and generalized search".
# These are data-generating choices, never audit thresholds.
suite_b:
  age_55_threshold: 55
  age_55_penalty: 140.0
  pincode_female_penalty: 200.0
  name_age45_penalty: 180.0
  high_loan_threshold: 600000.0
  pincode_high_loan_penalty: 200.0
  female_45_rural_n2_penalty: 260.0
  age_graded_start: 40
  age_graded_per_year: 6.0
  age_graded_cap: 180.0
  proxy_low_loan_threshold: 200000.0
  proxy_low_loan_penalty: 160.0
  control_income_credit_weight: 40.0
  control_burden_employment_weight: 30.0
  control_age_credit_weight: 25.0
  control_noise_sd: 60.0
  control_noise_seed: 15

mitigation:
  offset_min: 0
  offset_max: 240
  offset_step: 20
  max_accuracy_loss_default: 0.02
  n_samples: 6000

certificate:
  db_path: data/certificates.db

# Audit API service (v2). Operational settings only; no audit thresholds.
service:
  host: 127.0.0.1
  port: 8020
  audit_db: data/audits.db
  max_workers: 2
  sse_poll_seconds: 0.1

report:
  max_words: 250

# LLM screener target (R3c). Operational limits only; no audit thresholds.
# Pricing is an estimate used for the hard cost cap, not a billing record.
llm:
  api_key_env: ANTHROPIC_API_KEY
  model_env: ANTHROPIC_MODEL
  repeats: 3
  temperature: 0.0
  max_tokens: 64
  max_calls_per_audit: 300
  max_cost_usd: 1.00
  input_cost_per_mtok_usd: 3.00
  output_cost_per_mtok_usd: 15.00
  cache_dir: data/llm_cache
  pairs_per_probe: 24
